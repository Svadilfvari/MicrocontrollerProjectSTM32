<text x="24" y="312" font-size="12" fill="#59636e" text-anchor="start" font-weight="400" >d [cm] = t<tspan font-size="75%" dy="3">echo</tspan><tspan dy="-3">​</tspan> [µs] / 58.8   ·   1 tick = 62 / 32 MHz = 1.94 µs   ·   trigger and capture run in hardware + ISR; main() only waits for the flag</text>
