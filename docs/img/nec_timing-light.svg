<text x="24" y="296" font-size="12" fill="#59636e" text-anchor="start" font-weight="400" >Thresholds: Δt &gt; 8000 µs start of frame · &gt; 1700 µs bit 1 · &gt; 1000 µs bit 0. After 32 bits the ISR checks cmd == ~cmd and maps the word to a key.</text>
<text x="24" y="318" font-size="12" fill="#bc4c00" text-anchor="start" font-weight="400" >* The receiver output is active-low, so rising edges mark the end of each burst: the leader space is read as an extra 1</text>
<text x="24" y="336" font-size="12" fill="#bc4c00" text-anchor="start" font-weight="400" >  and the last data bit (MSB of ~cmd) falls into the next frame. See Known limitations.</text>
